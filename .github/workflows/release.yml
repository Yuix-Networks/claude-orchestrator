name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          grep -q "static let current = \"${GITHUB_REF_NAME#v}\"" Sources/claude-orchestrator/Output.swift \
            || { echo "AppVersion.current etiketle (${GITHUB_REF_NAME}) aynı değil"; exit 1; }

      - name: Test
        run: swift test

      - name: Build universal binary
        # `swift build --arch` birleşik (universal) ürün üretmiyor; xcodebuild
        # universal binary üretir.
        run: |
          xcodebuild -scheme claude-orchestrator -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build/xcode \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO build
          mkdir -p .build/artifacts
          # Kesin yol: `find … | head -1` dSYM içindeki DWARF dosyasını seçebiliyor
          # (v0.1.0–v0.2.1 sürümleri bu yüzden çalışmayan bir dosya yayınladı).
          BIN=".build/xcode/Build/Products/Release/claude-orchestrator"
          file "$BIN" | grep -q "executable" || { file "$BIN"; echo "çalıştırılabilir değil"; exit 1; }
          # `install -m 755`: çalıştırma izni tarball'a girmeli (v0.2.0'da `cp` ile kayboldu).
          install -m 755 "$BIN" .build/artifacts/claude-orchestrator
          test -x .build/artifacts/claude-orchestrator
          lipo -info .build/artifacts/claude-orchestrator
          .build/artifacts/claude-orchestrator --version | grep -q "${GITHUB_REF_NAME#v}" \
            || { echo "binary çalışmadı ya da sürümü yanlış"; exit 1; }

      - name: Create archive and checksum
        run: |
          cd .build/artifacts
          tar -czf "claude-orchestrator-${GITHUB_REF_NAME#v}.tar.gz" claude-orchestrator
          tar -tvzf "claude-orchestrator-${GITHUB_REF_NAME#v}.tar.gz" | grep -q '^-rwx' \
            || { echo "tarball'daki binary çalıştırılabilir değil"; exit 1; }
          shasum -a 256 "claude-orchestrator-${GITHUB_REF_NAME#v}.tar.gz" > "claude-orchestrator-${GITHUB_REF_NAME#v}.tar.gz.sha256"
          cat "claude-orchestrator-${GITHUB_REF_NAME#v}.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-orchestrator
          path: .build/artifacts/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            ".build/artifacts/claude-orchestrator-${GITHUB_REF_NAME#v}.tar.gz" \
            ".build/artifacts/claude-orchestrator-${GITHUB_REF_NAME#v}.tar.gz.sha256" \
            --title "claude-orchestrator ${GITHUB_REF_NAME}" \
            --generate-notes
